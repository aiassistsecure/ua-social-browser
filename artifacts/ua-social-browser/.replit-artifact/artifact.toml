kind = "web"
previewPath = "/"
title = "UA Social Browser"
description = "A Chromium-inspired social media workspace with isolated UA profiles, AI-assisted post creation, content planning, and private browser workspaces."
version = "1.0.0"
id = "artifacts/ua-social-browser"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26253

[services.development]
run = "pnpm --filter @workspace/ua-social-browser run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ua-social-browser", "run", "build" ]
serve = "static"
publicDir = "artifacts/ua-social-browser/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26253"
BASE_PATH = "/"
